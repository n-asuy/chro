[package]
name = "cbase"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }
chrono = { version = "0.4", features = ["clock"] }
regex = "1"
ignore = "0.4"
document = { path = "../document" }
thiserror = "1.0"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
