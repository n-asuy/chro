[package]
name = "local-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
command-group = "5"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
tracing = "0.1"
dirs = "5.0"
futures = "0.3"
notify-debouncer-full = "0.4"
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "macros",
    "chrono",
    "uuid",
    "json"
] }
uuid = { version = "1", features = ["serde", "v4"] }
serde_json = "1.0"
json-patch = "1.4"

runtime = { path = "../runtime" }
config = { path = "../config" }
db = { path = "../db" }
filesystem = { path = "../filesystem" }
git = { path = "../git" }
image = { package = "chro-image", path = "../image" }
log-types = { path = "../log-types" }
worktree = { path = "../worktree" }
events = { path = "../events" }
diff-stream = { path = "../diff-stream" }
approvals = { path = "../approvals" }
file-search-cache = { path = "../file-search-cache" }
executors = { path = "../executors" }

[dev-dependencies]
tempfile = "3.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }
