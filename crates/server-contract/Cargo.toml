[package]
name = "server-contract"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Wire contract of the chro operator API shared by the server and the chro CLI"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
