[package]
name = "executors"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
codex-app-server-protocol = { git = "https://github.com/openai/codex.git", package = "codex-app-server-protocol", rev = "637f7dd6d737f3961e6bf32fbb3861c4953269c5" }
codex-protocol = { git = "https://github.com/openai/codex.git", package = "codex-protocol", rev = "637f7dd6d737f3961e6bf32fbb3861c4953269c5" }
command-group = { version = "5", features = ["with-tokio"] }
convert_case = "0.6"
derivative = "2.2"
dirs = "5"
enum_dispatch = "0.3"
futures = "0.3"
futures-io = "0.3"
icu_provider = { version = "2.1.1", default-features = false, features = ["sync"] }
json-patch = "1.4"
lazy_static = "1.5"
log-types = { path = "../log-types" }
os_pipe = "1.2"
regex = "1.11"
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "1.3"
sqlx = "0.8"
strum = "0.27"
strum_macros = "0.27"
thiserror = "2.0"
toml = "0.8"
tokio = { version = "1", features = ["fs", "io-util", "process", "rt", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
ts-rs = { version = "10", features = ["serde-compat", "no-serde-warnings"] }
uuid = { version = "1", features = ["v4"] }
approvals = { path = "../approvals" }
events = { path = "../events" }
which = "7"

[target.'cfg(windows)'.dependencies]
winsplit = "0.1"
