[package]
name = "mobile-link"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace]

[dependencies]
crypto_box = { version = "0.9", features = ["salsa20"] }
xsalsa20poly1305 = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
thiserror = "2"
