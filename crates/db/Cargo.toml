[package]
name = "db"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "macros",
    "chrono",
    "uuid",
    "json",
] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ts-rs = { version = "10", features = ["chrono-impl", "uuid-impl", "serde-compat", "no-serde-warnings"] }
thiserror = "2.0"
async-trait = "0.1"
tracing = "0.1"
log-types = { path = "../log-types" }

[dependencies.dirs]
version = "5.0"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
