[package]
name = "runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "macros",
    "chrono",
    "uuid",
    "json"
] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"

config = { path = "../config" }
db = { path = "../db" }
filesystem = { path = "../filesystem" }
git = { path = "../git" }
image = { package = "chro-image", path = "../image" }
log-types = { path = "../log-types" }
worktree = { path = "../worktree" }
events = { path = "../events" }
approvals = { path = "../approvals" }
file-search-cache = { path = "../file-search-cache" }
diff-stream = { path = "../diff-stream" }
executors = { path = "../executors" }
skills = { path = "../skills" }

[dev-dependencies]
tempfile = "3"
