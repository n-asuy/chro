[package]
name = "diff-stream"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
futures = "0.3"
git = { path = "../git" }
filesystem = { path = "../filesystem" }
log-types = { path = "../log-types" }
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
