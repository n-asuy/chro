[package]
name = "chro-image"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
db = { path = "../db" }
dirs = "5"
once_cell = "1.19"
regex = "1.11"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono"] }
thiserror = "1.0"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
