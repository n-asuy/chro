[package]
name = "filesystem"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
ignore = "0.4"
rayon = "1.10"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
dunce = "1.0"
notify = "6"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
dirs = "5.0"

[features]
default = []

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
