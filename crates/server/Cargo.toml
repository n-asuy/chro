[package]
name = "chro-server"
version = "0.1.4"
edition = "2021"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["macros", "multipart"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive"] }
db = { path = "../db" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
thiserror = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "fs"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
log-types = { path = "../log-types" }
runtime = { path = "../runtime" }
local-runtime = { path = "../local-runtime" }
futures = "0.3"
approvals = { path = "../approvals" }
chro-image = { path = "../image" }
config = { path = "../config" }
events = { path = "../events" }
executors = { path = "../executors" }
filesystem = { path = "../filesystem" }
worktree = { path = "../worktree" }
git = { path = "../git" }
file-search-cache = { path = "../file-search-cache" }
analytics = { path = "../analytics" }
rust-embed = "8"
mime_guess = "2"
open = "5"

[target.'cfg(unix)'.dependencies]
rlimit = "0.10"
