[package]
name = "chro-desktop"
version = "0.1.63"
description = "Chro desktop application"
authors = ["Chro"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "chro_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "chro-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` enables embedded multi-webview (child webviews) — the native
# in-app browser pane (WKWebView/WebView2) rendered inside the main window.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
dirs = "5"
libc = "0.2"
url = "2"

# Tray badge rendering
resvg = "0.43"
usvg = "0.43"
tiny-skia = "0.11"
fontdb = "0.21"
base64 = "0.22"

# macOS notifications: the bundled toast backend (notify-rust) drops click
# responses and cannot set a custom icon, so we drive the lowest layer directly
# to support `app_icon` + click-to-open. objc2 is used only to keep the click
# wait loop off a CPU busy-spin. All already in the lock graph transitively.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSRunLoop", "NSPort"] }
# The edge toolbar samples the cursor off the main thread (CGEvent location).
core-graphics = "0.25"
# The edge toolbar's voice input and region capture: on-device speech
# recognition fed from the microphone, and a screenshot of a picked region.
# Speech and ScreenCaptureKit are loaded when first used (privacy.rs), so the
# app still launches on systems older than they are.
block2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "objc2"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-graphics", "NSBitmapImageRep", "NSImageRep", "NSScreen", "NSWindow", "NSResponder", "NSEvent", "NSGraphics"] }
objc2-speech = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-avf-audio", "SFSpeechRecognizer", "SFSpeechRecognitionRequest", "SFSpeechRecognitionTask", "SFSpeechRecognitionResult", "SFTranscription"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "block2", "AVAudioEngine", "AVAudioFile", "AVAudioNode", "AVAudioIONode", "AVAudioBuffer", "AVAudioFormat", "AVAudioTime", "AVAudioTypes"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-graphics", "SCShareableContent", "SCScreenshotManager", "SCStream"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
