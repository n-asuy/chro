[package]
name = "chro-desktop"
version = "0.1.50"
description = "Chro desktop application"
authors = ["Chro"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "chro_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "chro-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` enables embedded multi-webview (child webviews) — the native
# in-app browser pane (WKWebView/WebView2) rendered inside the main window.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
dirs = "5"
url = "2"

# Tray badge rendering
resvg = "0.43"
usvg = "0.43"
tiny-skia = "0.11"
fontdb = "0.21"
base64 = "0.22"

# macOS notifications: the bundled toast backend (notify-rust) drops click
# responses and cannot set a custom icon, so we drive the lowest layer directly
# to support `app_icon` + click-to-open. objc2 is used only to keep the click
# wait loop off a CPU busy-spin. All already in the lock graph transitively.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSRunLoop", "NSPort"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
