[package]
name = "api-worker"
version = "0.1.0"
edition = "2021"
authors = ["n-asuy"]
description = "Cloudflare Workers API for MCP data access"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["serde", "v4", "js"] }
worker = { version = "0.7", features = ["d1"] }
base64 = "0.22"
url = "2.5"
wasm-bindgen = "0.2.106"
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }

[features]
default = []
console_panic_hook = ["console_error_panic_hook"]

[dependencies.console_error_panic_hook]
version = "0.1"
optional = true
