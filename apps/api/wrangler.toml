name = "chro-api"
main = "build/worker/shim.mjs"
compatibility_date = "2025-03-10"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[build]
command = "cargo install -q worker-build && worker-build --release"

[observability]
enabled = true

[[d1_databases]]
binding = "APP_DB"
database_name = "dev-chro"
database_id = "47a3ea40-027e-4186-b53f-2b2dc18f2ff3"
