name: Verify Code Signing

# Fast, standalone check of the Azure Artifact Signing setup (OIDC federation,
# role assignment, certificate profile). Signs a throwaway executable through
# the same Tauri sign hook the release uses, so an auth/config problem surfaces
# in a few minutes instead of after the full ~30-minute desktop Rust build.
# Manual-trigger only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Azure Artifact Signing
    runs-on: windows-latest
    # Same environment as the release job, so this exercises the same federated
    # credential subject.
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    env:
      WINDOWS_SIGNER_SUBJECT: Curino
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fails fast when the variables or the OIDC permission are missing.
      - name: Setup Azure Artifact Signing
        uses: ./.github/actions/setup-artifact-signing
        with:
          client-id: ${{ vars.ARTIFACT_SIGNING_CLIENT_ID }}
          certificate-profile: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}

      # A minimal real PE the signer can operate on. Windows PowerShell 5.1's
      # CodeDOM compiler emits a standalone unsigned exe; PowerShell 7 (pwsh)
      # cannot ("assembly type ConsoleApplication not supported"), so pin the
      # shell to `powershell`.
      - name: Create throwaway executable
        shell: powershell
        run: |
          Add-Type -TypeDefinition 'public class P { public static void Main() { } }' `
            -OutputAssembly test.exe -OutputType ConsoleApplication
          if (-not (Test-Path test.exe)) { throw 'test.exe was not created' }

      - name: Sign with the Tauri signCommand wrapper
        shell: pwsh
        run: |
          & "${{ github.workspace }}/apps/desktop/scripts/sign-windows.ps1" `
            "${{ github.workspace }}/test.exe"

      - name: Check signer and timestamp
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -FilePath test.exe
          if ($signature.Status -ne "Valid" -or $null -eq $signature.SignerCertificate) {
            throw "Signature is not valid: $($signature.StatusMessage)"
          }
          $subject = $signature.SignerCertificate.Subject
          Write-Host "Signer: $subject"
          if ($subject -notlike "*$env:WINDOWS_SIGNER_SUBJECT*") {
            throw "Unexpected signer: $subject (expected '$env:WINDOWS_SIGNER_SUBJECT')"
          }
          if ($null -eq $signature.TimeStamperCertificate) {
            throw "Signature carries no timestamp."
          }
          Write-Host "Timestamped by: $($signature.TimeStamperCertificate.Subject)"

      - name: Show Windows signing log
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "sign-windows.log"
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
