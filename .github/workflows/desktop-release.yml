name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      target_os:
        description: "Target platform to build"
        required: false
        default: all
        type: choice
        options:
          - all
          - macos
          - windows
  push:
    tags:
      - "v*"

env:
  TURBO_TELEMETRY_DISABLED: "1"
  RELEASE_REPO: ${{ vars.RELEASE_REPO || 'n-asuy/chro' }}

permissions:
  contents: write

jobs:
  # This workflow is mirrored to the public repo, which is where releases are
  # actually built. On the private source repo every job is a no-op.
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    if: >
      github.repository == (vars.RELEASE_REPO || 'n-asuy/chro') &&
      startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Release notes are the tag's section of CHANGELOG.md. The tag itself
      # carries no annotation here: the OSS sync recreates it as a lightweight
      # tag on the exported commit, so reading `%(contents)` would only yield
      # the commit message.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v heading="## ${VERSION}" '
            $0 == heading { in_section = 1; next }
            in_section && /^## / { exit }
            in_section { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          if grep -q '^- ' release-notes.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CHANGELOG.md has no entry for ${VERSION}; generating notes from commits"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.notes.outputs.found }}" = "true" ]; then
            gh release create ${{ github.ref_name }} --repo ${{ env.RELEASE_REPO }} --title "Chro ${{ github.ref_name }}" --notes-file release-notes.md
          else
            gh release create ${{ github.ref_name }} --repo ${{ env.RELEASE_REPO }} --title "Chro ${{ github.ref_name }}" --generate-notes
          fi

  macos:
    name: Build macOS (${{ matrix.arch }})
    needs: create-release
    if: >
      always() &&
      github.repository == (vars.RELEASE_REPO || 'n-asuy/chro') &&
      (needs.create-release.result == 'success' || !startsWith(github.ref, 'refs/tags/')) &&
      (!startsWith(github.ref, 'refs/tags/') || !contains(github.ref_name, '-')) &&
      (github.event_name != 'workflow_dispatch' ||
       github.event.inputs.target_os == 'all' ||
       github.event.inputs.target_os == 'macos')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: x64
            triple: x86_64-apple-darwin
            artifact_name: desktop-macos-x64
          - os: macos-15
            arch: arm64
            triple: aarch64-apple-darwin
            artifact_name: desktop-macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.26

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            crates/server
          shared-key: desktop-${{ matrix.arch }}
          cache-on-failure: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Tauri icons
        run: bun run --filter=@chro/desktop tauri:icons

      - name: Read desktop version
        id: desktop_version
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "value=$VERSION" >> $GITHUB_OUTPUT

      - name: Package desktop (${{ matrix.arch }})
        env:
          NODE_ENV: production
          # Tauri 2 picks these env vars up to sign + notarize the .app /
          # .dmg automatically; the legacy CSC_* secrets are remapped to the
          # Tauri-native names so we can reuse the same .p12 unchanged.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE || secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun ./apps/desktop/scripts/deployer.ts package --project desktop -- --mac --${{ matrix.arch }}

      - name: Verify mac app signature
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${{ steps.desktop_version.outputs.value }}"
          # Tauri produces both .app.tar.gz (updater bundle) and .dmg per arch.
          # We check the latter so any signing regression surfaces inside CI.
          DMG_PATH=$(find "apps/desktop/release/${VERSION}" -maxdepth 1 -name "*.dmg" | head -n 1)
          if [ -z "${DMG_PATH}" ]; then
            echo "No DMG produced in apps/desktop/release/${VERSION}"
            exit 1
          fi
          TMP_DIR=$(mktemp -d)
          hdiutil attach -nobrowse -mountpoint "${TMP_DIR}/mnt" "${DMG_PATH}"
          APP_PATH=$(find "${TMP_DIR}/mnt" -maxdepth 2 -name "*.app" | head -n 1)
          if [ -z "${APP_PATH}" ]; then
            echo "No .app found inside ${DMG_PATH}"
            hdiutil detach "${TMP_DIR}/mnt" || true
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
          if [ -n "${APPLE_TEAM_ID}" ]; then
            TEAM_ID=$(codesign -dv --verbose=4 "${APP_PATH}" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2}')
            if [ "${TEAM_ID}" != "${APPLE_TEAM_ID}" ]; then
              echo "Code signing team mismatch: expected ${APPLE_TEAM_ID}, got ${TEAM_ID}"
              hdiutil detach "${TMP_DIR}/mnt" || true
              exit 1
            fi
          fi
          hdiutil detach "${TMP_DIR}/mnt" || true
          rm -rf "${TMP_DIR}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            apps/desktop/release/${{ steps.desktop_version.outputs.value }}/*.dmg
            apps/desktop/release/${{ steps.desktop_version.outputs.value }}/*.app.tar.gz
            apps/desktop/release/${{ steps.desktop_version.outputs.value }}/*.app.tar.gz.sig
          retention-days: 7

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ env.RELEASE_REPO }}
        run: bun ./apps/desktop/scripts/deployer.ts upload --tag ${{ github.ref_name }}

  windows:
    name: Build Windows (x64)
    needs: create-release
    if: >
      always() &&
      github.repository == (vars.RELEASE_REPO || 'n-asuy/chro') &&
      (needs.create-release.result == 'success' || !startsWith(github.ref, 'refs/tags/')) &&
      (!startsWith(github.ref, 'refs/tags/') || !contains(github.ref_name, '-')) &&
      (github.event_name != 'workflow_dispatch' ||
       github.event.inputs.target_os == 'all' ||
       github.event.inputs.target_os == 'windows')
    runs-on: windows-latest
    # Azure Artifact Signing authenticates with GitHub OIDC (no secrets). The
    # Entra app's federated credential trusts this environment, which makes the
    # token subject `repo:<owner>/<repo>:environment:windows-signing` for every
    # tag instead of a per-tag ref.
    environment: windows-signing
    permissions:
      contents: write
      id-token: write
    # Signing is configured when both repository/environment variables are set.
    # They are absent on forks and may be absent for manual test builds, which
    # then stay unsigned; tagged releases refuse to continue without them.
    env:
      ARTIFACT_SIGNING_CLIENT_ID: ${{ vars.ARTIFACT_SIGNING_CLIENT_ID }}
      ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
      WINDOWS_SIGNING: ${{ vars.ARTIFACT_SIGNING_CLIENT_ID != '' && vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE != '' }}
      # Matched against the signer subject of every verified binary. The exact
      # CN comes from the validated identity, so match on the organization.
      WINDOWS_SIGNER_SUBJECT: Curino
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tagged release that ships an unsigned Windows build is blocked by Smart
      # App Control on end-user machines, so refuse to publish one. Manual
      # (workflow_dispatch) builds may stay unsigned for internal testing.
      - name: Require code-signing for tagged releases
        if: startsWith(github.ref, 'refs/tags/') && env.WINDOWS_SIGNING != 'true'
        shell: bash
        run: |
          echo "::error::Missing Artifact Signing variables (ARTIFACT_SIGNING_CLIENT_ID/ARTIFACT_SIGNING_CERTIFICATE_PROFILE). Refusing to publish an unsigned Windows release that Smart App Control will block." >&2
          exit 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.26

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            crates/server
          shared-key: desktop-windows
          cache-on-failure: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Tauri icons
        run: bun run --filter=@chro/desktop tauri:icons

      - name: Read desktop version
        id: desktop_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "value=$VERSION" >> $GITHUB_OUTPUT

      # Installs SignTool + the Artifact Signing dlib and exports their paths.
      # Tauri then calls scripts/sign-windows.ps1 through
      # bundle.windows.signCommand for every Windows binary at the correct point
      # in the bundle lifecycle, so each file is signed before it is packaged.
      - name: Setup Azure Artifact Signing
        if: env.WINDOWS_SIGNING == 'true'
        uses: ./.github/actions/setup-artifact-signing
        with:
          client-id: ${{ env.ARTIFACT_SIGNING_CLIENT_ID }}
          certificate-profile: ${{ env.ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}

      - name: Package signed desktop (Windows x64)
        if: env.WINDOWS_SIGNING == 'true'
        env:
          NODE_ENV: production
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun ./apps/desktop/scripts/deployer.ts package --project desktop -- --win --x64

      # The sign hook's own output never reaches the build log (the bundler
      # captures it), so this is the only readable trace of a signing failure.
      - name: Show Windows signing log
        if: failure()
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "sign-windows.log"
          if (Test-Path -LiteralPath $log) {
            Get-Content -LiteralPath $log
          } else {
            Write-Host "No signing log at ${log}: the sign hook never started."
          }

      - name: Package unsigned desktop (manual test build)
        if: "!startsWith(github.ref, 'refs/tags/') && env.WINDOWS_SIGNING != 'true'"
        env:
          NODE_ENV: production
        run: bun ./apps/desktop/scripts/deployer.ts package --project desktop --skip-sign -- --win --x64

      - name: Verify packaged Windows signatures
        if: env.WINDOWS_SIGNING == 'true'
        shell: pwsh
        run: |
          # NSIS ignores the sign hook's exit status for the uninstaller, so a
          # failure there leaves a green build and an unsigned uninstaller. The
          # hook's own log is the only record of every invocation.
          $signLog = Join-Path $env:RUNNER_TEMP "sign-windows.log"
          if (-not (Test-Path -LiteralPath $signLog)) {
            throw "No signing log at '$signLog': the sign hook never ran."
          }
          $hookFailures = @(Select-String -LiteralPath $signLog -Pattern '^ERROR: ')
          if ($hookFailures.Count -gt 0) {
            $hookFailures | ForEach-Object { Write-Host $_.Line }
            throw "The Windows sign hook reported $($hookFailures.Count) failure(s)."
          }

          # One signature per Windows binary Tauri hands to the hook: the two
          # sidecars, chro-desktop.exe, five NSIS plugin DLLs, the uninstaller,
          # and the installer. A lower count means a file skipped the hook.
          $expectedSignatureCount = 10
          $signedFiles = @(Select-String -LiteralPath $signLog -Pattern '^Signed: ')
          $signedFiles | ForEach-Object { Write-Host $_.Line }
          if ($signedFiles.Count -ne $expectedSignatureCount) {
            throw "Expected $expectedSignatureCount signed files, the sign hook signed $($signedFiles.Count)."
          }

          function Assert-ExpectedSigner {
            param([string]$Label, [string]$Path)
            $signature = Get-AuthenticodeSignature -FilePath $Path
            if ($signature.Status -ne "Valid" -or $null -eq $signature.SignerCertificate) {
              throw "Signature is not valid for '$Label': $($signature.StatusMessage)"
            }
            $subject = $signature.SignerCertificate.Subject
            if ($subject -notlike "*$env:WINDOWS_SIGNER_SUBJECT*") {
              throw "Unexpected signer for '$Label': $subject (expected '$env:WINDOWS_SIGNER_SUBJECT')"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "Signature for '$Label' carries no timestamp; it would expire with the short-lived certificate."
            }
            Write-Host "$Label signer: $subject"
          }

          $releaseDir = "apps/desktop/release/${{ steps.desktop_version.outputs.value }}"
          $installer = Get-ChildItem -Path $releaseDir -Filter "*-setup.exe" |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "No Windows installer found in '$releaseDir'."
          }

          Assert-ExpectedSigner -Label $installer.Name -Path $installer.FullName

          # Inspect the actual payload that users receive, not the build tree
          # that Tauri restores to its unsigned state after bundling.
          $sevenZip = (Get-Command 7z -ErrorAction Stop).Source
          $extractDir = Join-Path $env:RUNNER_TEMP "chro-installer-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $extractDir | Out-Null
          & $sevenZip x $installer.FullName "-o$extractDir" -y | Write-Host
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip failed to extract the Windows installer."
          }

          $packagedExecutables = @(
            Get-ChildItem -Path $extractDir -Recurse -File -Filter "*.exe"
          )
          $expectedFiles = @(
            "chro-desktop.exe",
            "chro-server.exe",
            "chro.exe"
          )
          foreach ($expectedFile in $expectedFiles) {
            $packagedFile = $packagedExecutables |
              Where-Object { $_.Name -eq $expectedFile } |
              Select-Object -First 1
            if ($null -eq $packagedFile) {
              throw "Installer payload is missing an expected binary: $expectedFile"
            }
            Assert-ExpectedSigner -Label $expectedFile -Path $packagedFile.FullName
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: |
            apps/desktop/release/${{ steps.desktop_version.outputs.value }}/*.exe
            apps/desktop/release/${{ steps.desktop_version.outputs.value }}/*.msi
            apps/desktop/release/${{ steps.desktop_version.outputs.value }}/*.zip
            apps/desktop/release/${{ steps.desktop_version.outputs.value }}/*.zip.sig
          retention-days: 7

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ env.RELEASE_REPO }}
        run: bun ./apps/desktop/scripts/deployer.ts upload --tag ${{ github.ref_name }}

  # Assemble the macOS updater feed (latest-darwin.json) from the per-arch
  # signed bundles once both have been published, and upload it to the release.
  # This is what the in-app updater fetches; without it the endpoint 404s.
  updater-manifest:
    name: Publish updater manifest
    needs: macos
    if: >
      github.repository == (vars.RELEASE_REPO || 'n-asuy/chro') &&
      startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.26

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload latest-darwin.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ env.RELEASE_REPO }}
        run: bun ./apps/desktop/scripts/deployer.ts updater-manifest --tag ${{ github.ref_name }}
