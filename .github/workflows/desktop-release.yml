name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      target_os:
        description: "Target platform to build"
        required: false
        default: all
        type: choice
        options:
          - all
          - macos
          - windows
  push:
    tags:
      - "v*"

env:
  TURBO_TELEMETRY_DISABLED: "1"
  RELEASE_REPO: ${{ vars.RELEASE_REPO || 'n-asuy/chro' }}

permissions:
  contents: write

jobs:
  # This workflow is mirrored to the public repo, which is where releases are
  # actually built. On the private source repo every job is a no-op.
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    if: >
      github.repository == (vars.RELEASE_REPO || 'n-asuy/chro') &&
      startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag annotation
        id: tag_message
        run: |
          TAG_MESSAGE=$(git tag -l --format='%(contents)' ${{ github.ref_name }} | head -c 10000)
          if [ -n "$TAG_MESSAGE" ]; then
            echo "has_message=true" >> $GITHUB_OUTPUT
            echo "message<<EOF" >> $GITHUB_OUTPUT
            echo "$TAG_MESSAGE" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "has_message=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.tag_message.outputs.has_message }}" = "true" ]; then
            gh release create ${{ github.ref_name }} --repo ${{ env.RELEASE_REPO }} --title "Chro ${{ github.ref_name }}" --notes "${{ steps.tag_message.outputs.message }}"
          else
            gh release create ${{ github.ref_name }} --repo ${{ env.RELEASE_REPO }} --title "Chro ${{ github.ref_name }}" --generate-notes
          fi

  macos:
    name: Build macOS (${{ matrix.arch }})
    needs: create-release
    if: >
      always() &&
      github.repository == (vars.RELEASE_REPO || 'n-asuy/chro') &&
      (needs.create-release.result == 'success' || !startsWith(github.ref, 'refs/tags/')) &&
      (!startsWith(github.ref, 'refs/tags/') || !contains(github.ref_name, '-')) &&
      (github.event_name != 'workflow_dispatch' ||
       github.event.inputs.target_os == 'all' ||
       github.event.inputs.target_os == 'macos')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: x64
            triple: x86_64-apple-darwin
            artifact_name: desktop-macos-x64
          - os: macos-15
            arch: arm64
            triple: aarch64-apple-darwin
            artifact_name: desktop-macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.26

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            crates/server
          shared-key: desktop-${{ matrix.arch }}
          cache-on-failure: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Tauri icons
        run: bun run --filter=@chro/desktop tauri:icons

      - name: Read desktop version
        id: desktop_version
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "value=$VERSION" >> $GITHUB_OUTPUT

      - name: Package desktop (${{ matrix.arch }})
        env:
          NODE_ENV: production
          # Tauri 2 picks these env vars up to sign + notarize the .app /
          # .dmg automatically; the legacy CSC_* secrets are remapped to the
          # Tauri-native names so we can reuse the same .p12 unchanged.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE || secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun ./apps/desktop/scripts/deployer.ts package --project desktop -- --mac --${{ matrix.arch }}

      - name: Verify mac app signature
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${{ steps.desktop_version.outputs.value }}"
          # Tauri produces both .app.tar.gz (updater bundle) and .dmg per arch.
          # We check the latter so any signing regression surfaces inside CI.
          DMG_PATH=$(find "apps/desktop/release/${VERSION}" -maxdepth 1 -name "*.dmg" | head -n 1)
          if [ -z "${DMG_PATH}" ]; then
            echo "No DMG produced in apps/desktop/release/${VERSION}"
            exit 1
          fi
          TMP_DIR=$(mktemp -d)
          hdiutil attach -nobrowse -mountpoint "${TMP_DIR}/mnt" "${DMG_PATH}"
          APP_PATH=$(find "${TMP_DIR}/mnt" -maxdepth 2 -name "*.app" | head -n 1)
          if [ -z "${APP_PATH}" ]; then
            echo "No .app found inside ${DMG_PATH}"
            hdiutil detach "${TMP_DIR}/mnt" || true
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
          if [ -n "${APPLE_TEAM_ID}" ]; then
            TEAM_ID=$(codesign -dv --verbose=4 "${APP_PATH}" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2}')
            if [ "${TEAM_ID}" != "${APPLE_TEAM_ID}" ]; then
              echo "Code signing team mismatch: expected ${APPLE_TEAM_ID}, got ${TEAM_ID}"
              hdiutil detach "${TMP_DIR}/mnt" || true
              exit 1
            fi
          fi
          hdiutil detach "${TMP_DIR}/mnt" || true
          rm -rf "${TMP_DIR}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            apps/desktop/release/${{ steps.desktop_version.outputs.value }}/*.dmg
            apps/desktop/release/${{ steps.desktop_version.outputs.value }}/*.app.tar.gz
            apps/desktop/release/${{ steps.desktop_version.outputs.value }}/*.app.tar.gz.sig
          retention-days: 7

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ env.RELEASE_REPO }}
        run: bun ./apps/desktop/scripts/deployer.ts upload --tag ${{ github.ref_name }}

  windows:
    name: Build Windows (x64)
    needs: create-release
    if: >
      always() &&
      github.repository == (vars.RELEASE_REPO || 'n-asuy/chro') &&
      (needs.create-release.result == 'success' || !startsWith(github.ref, 'refs/tags/')) &&
      (!startsWith(github.ref, 'refs/tags/') || !contains(github.ref_name, '-')) &&
      (github.event_name != 'workflow_dispatch' ||
       github.event.inputs.target_os == 'all' ||
       github.event.inputs.target_os == 'windows')
    runs-on: windows-latest
    # SSL.com eSigner (cloud code signing) credentials. Exposed as env so step
    # `if:` guards and Tauri's signCommand wrapper can detect/use them. Absent
    # on forks/manual test builds, so those builds stay unsigned.
    env:
      ES_USERNAME: ${{ secrets.ES_USERNAME }}
      ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
      ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
      ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tagged release that ships an unsigned Windows build is blocked by Smart
      # App Control on end-user machines, so refuse to publish one. Manual
      # (workflow_dispatch) builds may stay unsigned for internal testing.
      - name: Require code-signing for tagged releases
        if: >
          startsWith(github.ref, 'refs/tags/') &&
          (env.ES_USERNAME == '' ||
           env.ES_PASSWORD == '' ||
           env.ES_CREDENTIAL_ID == '' ||
           env.ES_TOTP_SECRET == '')
        shell: bash
        run: |
          echo "::error::Missing SSL.com eSigner secrets (ES_USERNAME/ES_PASSWORD/ES_CREDENTIAL_ID/ES_TOTP_SECRET). Refusing to publish an unsigned Windows release that Smart App Control will block." >&2
          exit 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.26

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            crates/server
          shared-key: desktop-windows
          cache-on-failure: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Tauri icons
        run: bun run --filter=@chro/desktop tauri:icons

      - name: Read desktop version
        id: desktop_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "value=$VERSION" >> $GITHUB_OUTPUT

      # The action bootstraps SSL.com's Java CodeSignTool and exports
      # CODE_SIGN_TOOL_PATH. Tauri then calls scripts/sign-windows.ps1 through
      # bundle.windows.signCommand for every Windows binary at the correct point
      # in the bundle lifecycle.
      - name: Setup SSL.com CodeSignTool
        if: >
          env.ES_USERNAME != '' &&
          env.ES_PASSWORD != '' &&
          env.ES_CREDENTIAL_ID != '' &&
          env.ES_TOTP_SECRET != ''
        uses: sslcom/esigner-codesign@v1.3.2
        with:
          command: --version
          environment_name: PROD

      - name: Package signed desktop (Windows x64)
        if: >
          env.ES_USERNAME != '' &&
          env.ES_PASSWORD != '' &&
          env.ES_CREDENTIAL_ID != '' &&
          env.ES_TOTP_SECRET != ''
        env:
          NODE_ENV: production
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun ./apps/desktop/scripts/deployer.ts package --project desktop -- --win --x64

      - name: Package unsigned desktop (manual test build)
        if: >
          !startsWith(github.ref, 'refs/tags/') &&
          (env.ES_USERNAME == '' ||
           env.ES_PASSWORD == '' ||
           env.ES_CREDENTIAL_ID == '' ||
           env.ES_TOTP_SECRET == '')
        env:
          NODE_ENV: production
        run: bun ./apps/desktop/scripts/deployer.ts package --project desktop --skip-sign -- --win --x64

      - name: Verify packaged Windows signatures
        if: >
          env.ES_USERNAME != '' &&
          env.ES_PASSWORD != '' &&
          env.ES_CREDENTIAL_ID != '' &&
          env.ES_TOTP_SECRET != ''
        shell: pwsh
        run: |
          $releaseDir = "apps/desktop/release/${{ steps.desktop_version.outputs.value }}"
          $installer = Get-ChildItem -Path $releaseDir -Filter "*-setup.exe" |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "No Windows installer found in '$releaseDir'."
          }

          $installerSignature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($installerSignature.Status -ne "Valid" -or
              $null -eq $installerSignature.SignerCertificate) {
            throw "Installer signature is not valid: $($installerSignature.StatusMessage)"
          }
          Write-Host "Installer signer:" $installerSignature.SignerCertificate.Subject

          # Inspect the actual payload that users receive, not the build tree
          # that Tauri restores to its unsigned state after bundling.
          $sevenZip = (Get-Command 7z -ErrorAction Stop).Source
          $extractDir = Join-Path $env:RUNNER_TEMP "chro-installer-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $extractDir | Out-Null
          & $sevenZip x $installer.FullName "-o$extractDir" -y | Write-Host
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip failed to extract the Windows installer."
          }

          $packagedExecutables = @(
            Get-ChildItem -Path $extractDir -Recurse -File -Filter "*.exe"
          )
          $expectedFiles = @(
            "chro-desktop.exe",
            "chro-server.exe",
            "chro.exe"
          )
          foreach ($expectedFile in $expectedFiles) {
            $packagedFile = $packagedExecutables |
              Where-Object { $_.Name -eq $expectedFile } |
              Select-Object -First 1
            if ($null -eq $packagedFile) {
              throw "Installer payload is missing an expected binary: $expectedFile"
            }
            $packagedSignature = Get-AuthenticodeSignature -FilePath $packagedFile.FullName
            if ($packagedSignature.Status -ne "Valid" -or
                $null -eq $packagedSignature.SignerCertificate) {
              throw "Packaged binary signature is not valid for '$expectedFile': $($packagedSignature.StatusMessage)"
            }
            Write-Host "$expectedFile signer:" $packagedSignature.SignerCertificate.Subject
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: |
            apps/desktop/release/${{ steps.desktop_version.outputs.value }}/*.exe
            apps/desktop/release/${{ steps.desktop_version.outputs.value }}/*.msi
            apps/desktop/release/${{ steps.desktop_version.outputs.value }}/*.zip
            apps/desktop/release/${{ steps.desktop_version.outputs.value }}/*.zip.sig
          retention-days: 7

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ env.RELEASE_REPO }}
        run: bun ./apps/desktop/scripts/deployer.ts upload --tag ${{ github.ref_name }}

  # Assemble the macOS updater feed (latest-darwin.json) from the per-arch
  # signed bundles once both have been published, and upload it to the release.
  # This is what the in-app updater fetches; without it the endpoint 404s.
  updater-manifest:
    name: Publish updater manifest
    needs: macos
    if: >
      github.repository == (vars.RELEASE_REPO || 'n-asuy/chro') &&
      startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.26

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload latest-darwin.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ env.RELEASE_REPO }}
        run: bun ./apps/desktop/scripts/deployer.ts updater-manifest --tag ${{ github.ref_name }}
