name: CLI Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: cli-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: stable
  BUN_VERSION: "1.1.26"

jobs:
  # This workflow is mirrored to the public repo, which is where releases are
  # actually built. Every downstream job depends on extract-version, so guarding
  # it here makes the whole workflow a no-op on the private source repo.
  extract-version:
    runs-on: ubuntu-latest
    if: github.repository == (vars.RELEASE_REPO || 'n-asuy/chro') && !contains(github.ref_name, '-')
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG does not contain a valid semver version"
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-frontend:
    needs: extract-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract-version.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run --filter=@chro/desktop build:vite

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist-vite/
          retention-days: 1

  build-backend:
    needs: [extract-version, build-frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-x64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            name: linux-arm64
          - target: x86_64-apple-darwin
            os: macos-14
            name: macos-x64
          - target: aarch64-apple-darwin
            os: macos-15
            name: macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract-version.outputs.tag }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist-vite/

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/server
          shared-key: cli-${{ matrix.target }}
          cache-on-failure: true

      - name: Install musl tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build chro-server
        run: cargo build --release --target ${{ matrix.target }} --manifest-path crates/server/Cargo.toml

      - name: Locate binary
        id: bin
        shell: bash
        run: |
          # --manifest-path may place output under crates/server/target or root target
          if [ -f "target/${{ matrix.target }}/release/chro-server${{ runner.os == 'Windows' && '.exe' || '' }}" ]; then
            echo "dir=target/${{ matrix.target }}/release" >> $GITHUB_OUTPUT
          elif [ -f "crates/server/target/${{ matrix.target }}/release/chro-server${{ runner.os == 'Windows' && '.exe' || '' }}" ]; then
            echo "dir=crates/server/target/${{ matrix.target }}/release" >> $GITHUB_OUTPUT
          else
            echo "Binary not found" >&2
            find . -name "chro-server*" -path "*/release/*" 2>/dev/null || true
            exit 1
          fi

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/${{ matrix.name }}
          cp ${{ steps.bin.outputs.dir }}/chro-server dist/${{ matrix.name }}/chro-server
          cd dist/${{ matrix.name }}
          zip -q chro-server.zip chro-server
          rm chro-server

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.name }}
          cp ${{ steps.bin.outputs.dir }}/chro-server.exe dist/${{ matrix.name }}/chro-server.exe
          cd dist/${{ matrix.name }}
          powershell -Command "Compress-Archive -Path 'chro-server.exe' -DestinationPath 'chro-server.zip' -Force"
          rm chro-server.exe

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: dist/
          retention-days: 1

  upload-to-r2:
    needs: [extract-version, build-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract-version.outputs.tag }}

      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: binaries/
          merge-multiple: true

      - name: List downloaded binaries
        run: find binaries/

      - name: Configure AWS CLI for R2
        run: |
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws configure set default.region auto

      - name: Generate manifest and upload to R2
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          TAG="v${VERSION}"
          ENDPOINT="${{ secrets.R2_ENDPOINT }}"
          BUCKET="${{ secrets.R2_BUCKET }}"

          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const manifest = { version: '$TAG', platforms: {} };
            const platforms = ['linux-x64', 'linux-arm64', 'windows-x64', 'macos-x64', 'macos-arm64'];

            for (const platform of platforms) {
              manifest.platforms[platform] = {};
              const zipPath = 'binaries/' + platform + '/chro-server.zip';
              if (fs.existsSync(zipPath)) {
                const data = fs.readFileSync(zipPath);
                manifest.platforms[platform]['chro-server'] = {
                  sha256: crypto.createHash('sha256').update(data).digest('hex'),
                  size: data.length
                };
              }
            }
            fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, 2));
            console.log('Generated manifest:');
            console.log(JSON.stringify(manifest, null, 2));
          "

          for platform in linux-x64 linux-arm64 windows-x64 macos-x64 macos-arm64; do
            if [ -f "binaries/$platform/chro-server.zip" ]; then
              echo "Uploading $platform/chro-server.zip..."
              aws s3 cp "binaries/$platform/chro-server.zip" \
                "s3://$BUCKET/releases/$TAG/$platform/chro-server.zip" \
                --endpoint-url "$ENDPOINT"
            fi
          done

          echo "Uploading manifest..."
          aws s3 cp manifest.json \
            "s3://$BUCKET/releases/$TAG/manifest.json" \
            --endpoint-url "$ENDPOINT" --content-type "application/json"

          echo "{\"latest\":\"$VERSION\"}" | aws s3 cp - \
            "s3://$BUCKET/releases/latest.json" \
            --endpoint-url "$ENDPOINT" --content-type "application/json"

      - name: Verify upload
        run: |
          TAG="v${{ needs.extract-version.outputs.version }}"
          aws s3 ls "s3://${{ secrets.R2_BUCKET }}/releases/$TAG/" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
            --recursive

  publish-npm:
    needs: [extract-version, upload-to-r2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract-version.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Prepare npm package
        run: |
          cd apps/cli/npx-cli
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.config = { ...(pkg.config || {}), r2PublicUrl: "${{ secrets.R2_PUBLIC_URL }}" };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Pack and publish
        working-directory: apps/cli/npx-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm pack
          npm publish --access public
