title = "Chro gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Public embedded values and generated reports that contain no secrets."
regexTarget = "line"
paths = [
  # Generated license inventories: JSON "key" fields hold SPDX ids, not credentials.
  '''(^|/)reports/licenses/.*\.json$''',
  '''(^|/)artifacts/licenses/.*\.json$''',
]
regexes = [
  # PostHog project key shipped in the desktop client (publishable analytics key).
  '''POSTHOG_KEY\s*=\s*"phc_[A-Za-z0-9]+"''',
  # Tauri updater public key: embedded in every client to verify release signatures.
  # The private signing key lives only in CI secrets, never in the repo.
  '''"pubkey"\s*:\s*"[A-Za-z0-9+/=]+"''',
]
# gitleaks base64-decodes the updater pubkey to its minisign comment
# ("...public key: 8729ED81F534BCDB"); allowlist that public key id so the
# decoded form is not flagged as a generic secret.
stopwords = [
  "8729ED81F534BCDB",
]
